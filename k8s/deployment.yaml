apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-homelab
  template:
    metadata:
      labels:
        app: fastapi-homelab
    spec:
      containers:
        - name: fastapi
          image: ghcr.io/pramukh660/fastapi-microk8s-homelab:{{ image_tag }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-homelab
spec:
  type: NodePort
  selector:
    app: fastapi-homelab
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
