---
- name: Deploy FastAPI to MicroK8s
  hosts: microk8s_servers
  gather_facts: false
  become: true

  vars:
    repo_url: "https://github.com/Pramukh660/fastapi-microk8s-homelab.git"
    repo_branch: "main"

    project_dir: "/opt/fastapi-microk8s-homelab"

    image_name: "fastapi-homelab"
    image_archive: "/tmp/{{ image_name }}.tar"
    rendered_manifest: "/tmp/fastapi-deployment.yaml"

  tasks:

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - git
          - buildah
        state: present
        update_cache: true

    - name: Check MicroK8s is ready
      ansible.builtin.command:
        argv:
          - microk8s
          - status
          - --wait-ready
      changed_when: false

    - name: Clone or update GitHub repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ project_dir }}"
        version: "{{ repo_branch }}"
        force: true
        update: true
        depth: 1

    - name: Get Git commit SHA
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ project_dir }}"
          - rev-parse
          - --short=7
          - HEAD
      register: git_commit
      changed_when: false

    - name: Set image tag
      ansible.builtin.set_fact:
        image_tag: "{{ git_commit.stdout }}"

    - name: Build FastAPI image with Buildah
      ansible.builtin.command:
        argv:
          - buildah
          - bud
          - --format
          - docker
          - -t
          - "{{ image_name }}:{{ image_tag }}"
          - "{{ project_dir }}"
      changed_when: true

    - name: Export image to Docker archive
      ansible.builtin.command:
        argv:
          - buildah
          - push
          - "{{ image_name }}:{{ image_tag }}"
          - "docker-archive:{{ image_archive }}:{{ image_name }}:{{ image_tag }}"
      changed_when: true

    - name: Import image into MicroK8s containerd
      ansible.builtin.command:
        argv:
          - microk8s
          - ctr
          - images
          - import
          - "{{ image_archive }}"
      changed_when: true

    - name: Render Kubernetes manifest
      ansible.builtin.shell:
        cmd: |
          sed \
            -e 's/{{ "{{" }} image_name {{ "}}" }}/{{ image_name }}/g' \
            -e 's/{{ "{{" }} image_tag {{ "}}" }}/{{ image_tag }}/g' \
            "{{ project_dir }}/k8s/deployment.yaml" \
            > "{{ rendered_manifest }}"
      changed_when: true

    - name: Apply Kubernetes manifest
      ansible.builtin.command:
        argv:
          - microk8s
          - kubectl
          - apply
          - -f
          - "{{ rendered_manifest }}"
      register: apply_result
      changed_when: >-
        'created' in apply_result.stdout or
        'configured' in apply_result.stdout

    - name: Wait for deployment rollout
      ansible.builtin.command:
        argv:
          - microk8s
          - kubectl
          - rollout
          - status
          - deployment/fastapi-homelab
          - --timeout=120s
      changed_when: false

    - name: Check FastAPI health endpoint
      ansible.builtin.uri:
        url: "http://{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}:30080/health"
        return_content: true
      delegate_to: localhost
      become: false

    - name: Show deployed commit
      ansible.builtin.debug:
        msg: "FastAPI deployed from Git commit {{ image_tag }}"

    - name: Remove temporary files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ image_archive }}"
        - "{{ rendered_manifest }}"
