---
- name: Deploy FastAPI from GHCR to MicroK8s
  hosts: microk8s_servers
  gather_facts: false
  become: true

  vars:
    rendered_manifest: /tmp/fastapi-deployment.yaml

  tasks:
    - name: Require a Git SHA image tag
      ansible.builtin.assert:
        that:
          - image_tag is defined
          - image_tag is match('^[0-9a-f]{7,40}$')
        fail_msg: "Pass the SHA tag published by GitHub Actions, e.g. -e image_tag=abcdef1."

    - name: Check MicroK8s is ready
      ansible.builtin.command:
        argv: [microk8s, status, --wait-ready]
      changed_when: false

    - name: Render Kubernetes manifest with selected image tag
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../k8s/deployment.yaml"
        dest: "{{ rendered_manifest }}"
        mode: "0644"

    - name: Apply Kubernetes manifest
      ansible.builtin.command:
        argv: [microk8s, kubectl, apply, -f, "{{ rendered_manifest }}"]
      register: apply_result
      changed_when: "'created' in apply_result.stdout or 'configured' in apply_result.stdout"

    - name: Wait for FastAPI deployment rollout
      ansible.builtin.command:
        argv:
          - microk8s
          - kubectl
          - rollout
          - status
          - deployment/fastapi-homelab
          - --timeout=180s
      changed_when: false

    - name: Show deployed Kubernetes image
      ansible.builtin.command:
        argv:
          - microk8s
          - kubectl
          - get
          - deployment
          - fastapi-homelab
          - -o
          - "jsonpath={.spec.template.spec.containers[0].image}"
      register: deployed_image
      changed_when: false

    - name: Verify FastAPI health endpoint from control node
      ansible.builtin.uri:
        url: "http://{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}:30080/health"
        return_content: true
        status_code: 200
      delegate_to: localhost
      become: false

    - name: Show deployment result
      ansible.builtin.debug:
        msg:
          - "Deployed image: {{ deployed_image.stdout }}"
          - "Git SHA tag: {{ image_tag }}"
          - "Health endpoint returned HTTP 200."

    - name: Remove rendered manifest
      ansible.builtin.file:
        path: "{{ rendered_manifest }}"
        state: absent
