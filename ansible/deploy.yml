
---
- name: Deploy FastAPI to MicroK8s
  hosts: microk8s_servers
  gather_facts: false
  become: true

  vars:
    project_dir: "{{ playbook_dir }}/.."
    image_name: fastapi-homelab
    image_tag: "{{ lookup('pipe', 'git -C ' ~ (playbook_dir ~ '/..') ~ ' rev-parse --short=7 HEAD') }}"
    image_archive: "/tmp/{{ image_name }}-{{ image_tag }}.tar"
    rendered_manifest: /tmp/fastapi-deployment.yaml

  tasks:
    - name: Check Git working tree
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ project_dir }}"
          - status
          - --porcelain
      register: git_status
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Require committed changes
      ansible.builtin.assert:
        that:
          - git_status.stdout | length == 0
        fail_msg: "Commit or discard local changes before deployment."

    - name: Build tagged FastAPI image
      community.docker.docker_image:
        name: "{{ image_name }}"
        tag: "{{ image_tag }}"
        source: build
        build:
          path: "{{ project_dir }}"
      delegate_to: localhost
      become: false

    - name: Save tagged image
      ansible.builtin.command:
        argv:
          - docker
          - save
          - -o
          - "{{ image_archive }}"
          - "{{ image_name }}:{{ image_tag }}"
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Copy image archive to server
      ansible.builtin.copy:
        src: "{{ image_archive }}"
        dest: "{{ image_archive }}"
        mode: "0644"

    - name: Import image into MicroK8s
      ansible.builtin.command:
        argv:
          - microk8s
          - ctr
          - image
          - import
          - "{{ image_archive }}"
      changed_when: true

    - name: Render Kubernetes manifest
      ansible.builtin.template:
        src: "{{ project_dir }}/k8s/deployment.yaml"
        dest: "{{ rendered_manifest }}"
        mode: "0644"

    - name: Apply Kubernetes manifest
      ansible.builtin.command:
        argv:
          - microk8s
          - kubectl
          - apply
          - -f
          - "{{ rendered_manifest }}"
      register: apply_result
      changed_when: >-
        'created' in apply_result.stdout or
        'configured' in apply_result.stdout

    - name: Wait for deployment rollout
      ansible.builtin.command:
        argv:
          - microk8s
          - kubectl
          - rollout
          - status
          - deployment/fastapi-homelab
          - --timeout=120s
      changed_when: false

    - name: Check FastAPI health endpoint
      ansible.builtin.uri:
        url: "http://{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}:30080/health"
        return_content: true
      delegate_to: localhost
      become: false
