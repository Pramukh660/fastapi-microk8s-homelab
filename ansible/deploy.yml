
---
- name: Deploy FastAPI to MicroK8s
  hosts: microk8s_servers
  gather_facts: false
  become: true

  vars:
    project_dir: "{{ playbook_dir }}/.."
    image_name: fastapi-homelab
    image_tag: "{{ lookup('pipe', 'git -C ' ~ playbook_dir ~ '/.. rev-parse --short=7 HEAD') }}"
    image_archive: /tmp/fastapi-homelab.tar

  tasks:
    - name: Build FastAPI image on Ansible control machine
      community.docker.docker_image:
        name: fastapi-homelab
        tag: "1.0"
        source: build
        build:
          path: "{{ project_dir }}"
      delegate_to: localhost
      become: false

    - name: Save image on Ansible control machine
      ansible.builtin.command:
        cmd: docker save -o /tmp/fastapi-homelab.tar {{ image_name }}
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Copy image archive to server
      ansible.builtin.copy:
        src: /tmp/fastapi-homelab.tar
        dest: "{{ image_archive }}"
        mode: "0644"

    - name: Import image into MicroK8s
      ansible.builtin.command:
        cmd: microk8s ctr image import {{ image_archive }}
      register: image_import
      changed_when: true

    - name: Apply Kubernetes manifest
      ansible.builtin.command:
        cmd: microk8s kubectl apply -f {{ project_dir }}/k8s/deployment.yaml
      register: apply_result
      changed_when: "'configured' in apply_result.stdout or 'created' in apply_result.stdout"

    - name: Wait for FastAPI rollout
      ansible.builtin.command:
        cmd: microk8s kubectl rollout status deployment/fastapi-homelab --timeout=120s
      changed_when: false

    - name: Check FastAPI health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:30080/health
        return_content: true
      delegate_to: localhost
      become: false
