apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: ghcr.io/pramukh660/homelab-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - {name: API_URL, value: changeme}
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: {app: frontend}
  ports:
    - port: 80
      targetPort: 80
