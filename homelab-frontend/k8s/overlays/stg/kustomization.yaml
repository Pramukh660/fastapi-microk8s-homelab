apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stg
resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
images:
  - name: ghcr.io/pramukh660/homelab-frontend
    newTag: latest   # set to the CI short SHA
patches:
  - target: {kind: Deployment, name: frontend}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - {name: API_URL, value: "http://api.stg.example.com"}
